name: Release

# Publishing runs entirely on OIDC: PyPI trusted publishing and the MCP
# registry both accept this workflow's short-lived identity token, so no
# long-lived API token is stored anywhere. The file name must stay
# `workflow.yml` -- it is what the PyPI trusted publisher is bound to.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The host targets Windows: registry discovery, Credential Manager and the
    # default profile location are all Windows paths.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install "mcp[cli]==2.0.0"
      - name: Run the unit suite
        # There is no tests/__init__.py, so discovery has to start inside tests/.
        working-directory: tests
        env:
          PYTHONPATH: ../src
        run: python -m unittest discover -s . -t .

  frozen-binary:
    # The unit suite asserts the tool surface from source; this asserts the
    # PyInstaller bundle Caros actually launches still carries it. Only the
    # frozen build exercises the hidden imports, the worker.py staged under
    # _internal/, and the sys._MEIPASS path resolution -- a dropped import or an
    # unstaged worker passes every source-mode test and breaks only here. It
    # cannot reach PLAXIS in CI, but discovery (initialize + tools/list) needs
    # no connection, so a wrong tool count is still caught.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build dependencies with pinned hashes
        run: python -m pip install --require-hashes --requirement requirements-build.lock
      - name: Verify the build lock matches the installed set
        run: python scripts/verify_dependencies.py --requirements requirements-build.lock
      - name: Build the one-directory bundle
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/plaxis-mcp.spec
      - name: The version the exe reports matches the package
        shell: python
        run: |
          import pathlib, subprocess, sys, tomllib
          # A resolved absolute path -- CreateProcess does not reliably accept a
          # relative forward-slash exe path on Windows.
          exe = str(pathlib.Path("dist/plaxis-mcp/plaxis-mcp.exe").resolve())
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          out = subprocess.run([exe, "--version"], capture_output=True, text=True, check=True).stdout.strip()
          if out != "plaxis-mcp %s" % version:
              sys.exit("exe reported %r, expected plaxis-mcp %s" % (out, version))
          print(out)
      - name: The worker source is staged into the bundle
        shell: python
        run: |
          import pathlib, sys
          root = pathlib.Path("dist/plaxis-mcp/_internal/worker")
          missing = [n for n in ("worker.py", "worker_runtime.py") if not (root / n).is_file()]
          if missing:
              sys.exit("worker not staged: %s" % missing)
          print("worker staged:", sorted(p.name for p in root.iterdir()))
      - name: No Bentley/Seequent/plxscripting paths shipped
        run: python scripts/write_artifact_manifest.py --artifact-root dist/plaxis-mcp
      - name: The frozen exe advertises the full tool surface
        # Env mode needs no generated profile and never starts the worker (no
        # connect), so the bundle-python path only has to be a real file.
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys
          exe = str(pathlib.Path("dist/plaxis-mcp/plaxis-mcp.exe").resolve())
          env = dict(os.environ)
          env["PLAXIS_ROLE"] = "input"
          env["PLAXIS_INPUT_BUNDLE_PYTHON"] = r"C:\Windows\System32\cmd.exe"
          proc = subprocess.Popen([exe], stdin=subprocess.PIPE,
                                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, env=env)
          def send(msg): proc.stdin.write(json.dumps(msg) + "\n"); proc.stdin.flush()
          try:
              send({"jsonrpc": "2.0", "id": 1, "method": "initialize",
                    "params": {"protocolVersion": "2025-06-18", "capabilities": {},
                               "clientInfo": {"name": "ci", "version": "1"}}})
              proc.stdout.readline()
              send({"jsonrpc": "2.0", "method": "notifications/initialized", "params": {}})
              send({"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}})
              names = sorted(t["name"] for t in json.loads(proc.stdout.readline())["result"]["tools"])
          finally:
              proc.terminate()
          expected = 34
          if len(names) != expected:
              sys.exit("frozen exe advertised %d tools, expected %d: %s" % (len(names), expected, names))
          for required in ("list_objects", "model_state", "view_results"):
              if required not in names:
                  sys.exit("frozen exe is missing %s" % required)
          print("frozen exe advertises %d tools" % len(names))

  versions-agree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check the tag, package and server.json versions agree
        shell: python
        run: |
          import json, os, pathlib, re, sys, tomllib

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          init = re.search(
              r'__version__ = "([^"]+)"',
              pathlib.Path("src/plaxis_mcp/__init__.py").read_text(),
          ).group(1)
          server = json.loads(pathlib.Path("server.json").read_text())
          found = {
              "pyproject": pyproject,
              "__init__": init,
              "server.json": server["version"],
              "server.json package": server["packages"][0]["version"],
          }
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/v"):
              found["tag"] = ref.removeprefix("refs/tags/v")

          if len(set(found.values())) != 1:
              sys.exit("versions disagree: %s" % found)
          print("all sources agree on %s" % pyproject)

  publish-pypi:
    needs: [test, versions-agree]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: Confirm the registry ownership marker survived into the sdist
        # The registry proves ownership by finding this line in the README that
        # PyPI serves, so a build that dropped it would publish fine and then
        # fail the registry step with a confusing permissions error.
        # The sdist carries two PKG-INFO members, so piping straight into
        # `grep -q` leaves tar writing into a pipe grep already closed on the
        # first match: tar exits 2 and pipefail fails the step even though the
        # marker was found. Extract first, then match.
        run: |
          set -euo pipefail
          tar -xzOf dist/*.tar.gz --wildcards '*/PKG-INFO' > "$RUNNER_TEMP/pkg-info.txt"
          grep -q 'mcp-name: io.github.yixuanzhong/plaxis-mcp' "$RUNNER_TEMP/pkg-info.txt"
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-registry:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Wait for the new version to be servable from PyPI
        # The registry fetches the package metadata itself to check the
        # ownership marker, so publishing before the index catches up fails.
        run: |
          set -euo pipefail
          version=$(python -c 'import json;print(json.load(open("server.json"))["version"])')
          for _ in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/plaxis-mcp/$version/json" > /dev/null; then
              echo "plaxis-mcp $version is available"
              exit 0
            fi
            sleep 10
          done
          echo "plaxis-mcp $version did not appear on PyPI" >&2
          exit 1
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
