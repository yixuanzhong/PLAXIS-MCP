[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plaxis-mcp"
version = "0.3.2"
description = "Client-neutral stdio MCP server for PLAXIS Remote Scripting"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Yixuan Zhong" }
]
dependencies = [
  "mcp[cli]==1.26.0",
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
# Packaging is intentionally an opt-in host-side dependency. Nothing in this
# project installs into a PLAXIS-owned Python distribution.
package = [
  "pyinstaller==6.16.0",
]

[project.urls]
Repository = "https://github.com/yixuanzhong/PLAXIS-MCP"

[project.scripts]
plaxis-mcp = "plaxis_mcp.server:main"
plaxis-mcp-credentials = "plaxis_mcp.deployment:credentials_main"
plaxis-mcp-profiles = "plaxis_mcp.deployment:profiles_main"
plaxis-mcp-setup = "plaxis_mcp.deployment:setup_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

