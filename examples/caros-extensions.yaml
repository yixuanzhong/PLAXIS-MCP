# Caros 0.3.1 and later BUNDLE these two extensions, disabled by default --
# enable them in Settings -> Extensions after running setup once. This file is
# for older Caros builds and for a hand-maintained config.yaml; add it under
# the `extensions` key and replace <YOU> with the Windows account that ran the
# PLAXIS-MCP installer.
#
# Both entries launch the same signed executable; --role decides the role, the
# endpoint, and which installation's password is read from Windows Credential
# Manager. No password appears here and no PLAXIS_* variable is set -- `serve`
# refuses to start if any PLAXIS endpoint environment override is present.
#
# Provision the machine first. This is once per machine, not once per client:
#   plaxis-mcp.exe setup
#
# Set GOOSE_MODE=smart_approve for the Caros process itself; it is not an
# extension variable. Every mutator below must stay on Ask Before. Client
# approval is the only barrier: neither an approval prompt nor a Caros
# checkpoint can restore PLAXIS state, so work on disposable projects.
extensions:
  plaxis_input:
    enabled: true
    type: stdio
    name: PLAXIS Input
    description: Local PLAXIS Input Remote Scripting MCP server
    cmd: 'C:\Users\<YOU>\AppData\Local\Caros\PLAXIS-MCP\plaxis-mcp.exe'
    args:
      - serve
      - --role
      - input
    timeout: 300
    available_tools:
      - connect
      - disconnect
      - connection_status
      - list_members
      - inspect
      - project_info
      - list_phases
      - list_materials
      - set_property
      - call_method
      - new_project
      - open_project
      - close_project
      - recover_project
      - save_project
      - create_phase
      - set_current_phase
      - activate
      - deactivate
      - calculate
      - set_phase_property
      - set_mode
      - generate_mesh
      - create_point
      - create_line
      - create_polygon
      - create_borehole
      - create_soillayer
      - create_material
      - assign_material
      - create_structural_element

  plaxis_output:
    enabled: true
    type: stdio
    name: PLAXIS Output
    description: Local PLAXIS Output Remote Scripting MCP server
    cmd: 'C:\Users\<YOU>\AppData\Local\Caros\PLAXIS-MCP\plaxis-mcp.exe'
    args:
      - serve
      - --role
      - output
    timeout: 300
    available_tools:
      - connect
      - disconnect
      - connection_status
      - list_members
      - inspect
      - project_info
      - list_phases
      - list_materials
      - list_result_types
      - get_results
      - get_single_result
